<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locker Admin</title>
{% block head %}{% endblock %}
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
  nav{background:#0f172a;padding:12px 24px;display:flex;gap:20px;align-items:center}
  nav b{color:#38bdf8;margin-right:16px} nav a{color:#e2e8f0;text-decoration:none} nav a:hover{color:#38bdf8}
  nav .sp{flex:1}
  main{padding:24px;max-width:1300px;margin:auto}
  table{border-collapse:collapse;width:100%;background:#fff;border-radius:8px;overflow:hidden}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:14px}
  th{background:#e2e8f0}
  tr.out td{background:#fecaca} tr.in td{background:#bbf7d0}
  input,select,button{padding:8px 10px;font-size:14px;border:1px solid #94a3b8;border-radius:6px}
  button,.btn{background:#0f172a;color:#fff;border:0;cursor:pointer;text-decoration:none;padding:8px 14px;border-radius:6px;font-size:14px;display:inline-block}
  .btn.red,button.red{background:#dc2626} .btn.green,button.green{background:#16a34a}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .pill{padding:4px 12px;border-radius:999px;font-weight:600;font-size:13px}
  .pill.r{background:#fecaca} .pill.g{background:#bbf7d0}
  .flash{padding:10px 14px;border-radius:6px;margin-bottom:14px} .flash.ok{background:#bbf7d0} .flash.error{background:#fecaca}
  .card{background:#fff;padding:20px;border-radius:8px;max-width:520px}
  .card label{display:block;margin:10px 0 4px;font-weight:600} .card input,.card select{width:100%}
  img.th{height:42px;border-radius:4px;vertical-align:middle}
  a.sn{color:#0f172a;font-weight:700}
</style>
</head>
<body>
{% if session.admin %}
<nav><b>LOCKER ADMIN</b>
  <a href="{{ url_for('logs') }}">Logs</a>
  <a href="{{ url_for('students') }}">Students</a>
  <a href="{{ url_for('compartments') }}">Compartments</a>
  <span class="sp"></span><a href="{{ url_for('logout') }}">Logout</a></nav>
{% endif %}
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body></html>
